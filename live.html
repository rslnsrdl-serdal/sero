e;right:4%;top:44%;transform:translateY(-50%);opacity:.43;pointer-events:none}.intro>*{position:relative;z-index:1}.intro .sub{max-width:570px}.tiles{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin:20px 0}.tile{display:block;text-align:left;min-height:200px;padding:27px;background:#192750;border:1px solid #3a4d77;border-radius:21px;color:#fff;transition:transform .15s,border .15s}.tile:hover{transform:translateY(-4px);border-color:var(--mint)}.tile .emoji{font-size:42px;display:block;margin-bottom:19px}.tile strong{font-size:24px;display:block;letter-spacing:-.5px}.tile small{color:var(--muted);font-size:13px;display:block;margin-top:9px;line-height:1.6}.chips{display:flex;gap:9px;flex-wrap:wrap}.chip{background:#28345d;border:1px solid #44527c;border-radius:13px;color:#d6e1fe;padding:12px 16px;font-size:13px;font-weight:800}.chip.selected{background:#215d70;border-color:var(--mint);color:#eafff8}.field{display:block;color:#dae7ff;font-size:13px;font-weight:850;margin:23px 0 10px}.select,.input{width:100%;padding:15px;border-radius:13px;border:1px solid #536088;outline:none;background:#222f59;color:#fff}.input:focus,.select:focus{border-color:var(--mint)}.settings{display:grid;grid-template-columns:1fr 1fr;gap:10px 16px}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:26px}.btn{border-radius:14px;padding:15px 23px;font-weight:900;background:#2a3661;border:1px solid #4c5a85;color:#fff}.btn:hover{filter:brightness(1.12)}.btn.primary{background:linear-gradient(105deg,#70edc7,#74cfe9);color:#082b40;border:0}.btn.warning{background:#6e354e;border:1px solid #aa6478}.center{text-align:center}.center .sub{margin-left:auto;margin-right:auto}.pin{font-size:clamp(56px,12vw,116px);font-weight:1000;letter-spacing:12px;line-height:1.2;color:#ffe28f;margin:9px auto 15px;font-variant-numeric:tabular-nums}.big-emoji{font-size:75px;line-height:1.35}.playergrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:22px}.player{padding:15px;background:#293660;border:1px solid #50638e;border-radius:14px;display:flex;gap:10px;align-items:center;overflow-wrap:anywhere;font-weight:800}.player b{font-size:22px}.muted{color:var(--muted)}.small{font-size:12px;line-height:1.7}.block{margin-top:19px}.bar{height:9px;border-radius:9px;background:#39446f;overflow:hidden;margin:17px 0}.fill{height:100%;border-radius:9px;background:linear-gradient(90deg,#75f0c5,#5db6f7);width:100%;transition:width .16s}.questionbox{position:relative;overflow:hidden;border:1px solid #506aa0;border-radius:22px;padding:22px;background:radial-gradient(circle at 50% 10%,#334982,#20335f);text-align:center;min-height:180px}.qVisual{height:160px;display:grid;place-items:center}.qVisual img{max-height:130px;max-width:250px;width:auto;object-fit:contain;border-radius:4px;filter:drop-shadow(0 9px 16px #0007)}.qVisual .flagemoji{font-size:105px}.qVisual svg{max-width:340px;width:100%;height:155px}.qVisual .big{font-size:94px}.questionbox h2{font-size:clamp(21px,3.4vw,34px);margin:13px auto 5px;max-width:790px;line-height:1.35;letter-spacing:-.5px}.answers{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:17px}.answer{position:relative;padding:20px;color:#fff;font-size:clamp(14px,2.4vw,20px);border:2px solid transparent;text-align:center;font-weight:850;min-height:90px;display:flex;align-items:center;justify-content:center;gap:12px;border-radius:14px;line-height:1.35}.answer:hover:not(:disabled){filter:brightness(1.14)}.answer.selected{border:3px solid #fff;box-shadow:inset 0 0 0 3px #ffffff40}.answer.correct{box-shadow:inset 0 0 0 4px #fff}.answer.dim{opacity:.35}.answer:nth-child(1){background:var(--red)}.answer:nth-child(2){background:var(--blue)}.answer:nth-child(3){background:var(--orange)}.answer:nth-child(4){background:var(--green)}.answer .symbol{font-size:27px;color:#fff}.qhead{display:flex;justify-content:space-between;gap:13px;align-items:center;margin-bottom:19px;font-size:14px;font-weight:850}.timer{background:#ecf7ff;color:#182244;border-radius:99px;padding:11px 18px;font-weight:950;display:inline-block;min-width:60px;text-align:center}.leaderboard{display:grid;gap:10px;max-width:820px;margin:20px auto}.rank{background:#26355d;border:1px solid #3f5281;border-radius:13px;display:grid;grid-template-columns:38px 1fr auto;gap:12px;align-items:center;text-align:left;padding:14px 19px}.rank .position{font-size:20px;color:var(--yellow);font-weight:950}.rank strong{font-size:16px;overflow-wrap:anywhere}.rank .points{font-size:18px;font-weight:900;color:var(--mint)}.scoreStat{font-size:clamp(55px,11vw,112px);font-weight:950;color:var(--mint);letter-spacing:-5px;margin:14px auto}.medals{font-size:47px}.joinpin{width:100%;font-size:clamp(34px,6vw,52px);font-weight:950;letter-spacing:9px;text-align:center;color:var(--yellow);padding:19px}.hint{color:#b7c8ed;line-height:1.7;font-size:12px}.error{background:#63263e;border:1px solid #c06079;color:#ffe9f0;border-radius:12px;padding:15px;margin:17px 0}.success{background:#185748;border:1px solid #46bb96;color:#d9fff1;border-radius:12px;padding:15px;margin:17px 0}.badge{display:inline-block;background:#245c57;border:1px solid #459987;border-radius:99px;font-size:11px;padding:7px 12px;color:#cbfff0;font-weight:900;letter-spacing:1px}.grow{flex:1}.foot{margin:32px 0 0;text-align:center;font-size:12px;color:#8b9cbd;line-height:1.8}.back{background:none;color:#9faed0;font-weight:850;margin:0 0 18px;padding:7px 0}.label{color:#94a8ca;font-size:12px;letter-spacing:1px;text-transform:uppercase;font-weight:800}.footerline{display:flex;justify-content:space-between;gap:10px;align-items:center;flex-wrap:wrap;padding-top:20px}.statline{margin:15px 0;color:#bfd2eb;font-weight:700}.empty{padding:25px;text-align:center;color:#b0c0e2}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:20px}.infobox{border-radius:15px;padding:19px;background:#23325b;border:1px solid #435782}.infobox strong{font-size:28px;color:var(--mint)}.infobox small{display:block;margin-top:4px;color:#b7c7df}.visuallyHidden{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(1px,1px,1px,1px);white-space:nowrap}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f6e18b;outline-offset:2px}

<script>
"use strict";
const $=id=>document.getElementById(id),APP=$("app");
const REGIONS={all:"🌎 Tüm dünya",Europe:"Avrupa",Asia:"Asya",Africa:"Afrika",Americas:"Amerika",Oceania:"Okyanusya"};
const MODES={mix:"🎲 Karışık",flag:"🚩 Bayrak",capital:"🏛️ Başkent",shape:"🗺️ Siluet",language:"🗣️ Dil",continent:"🧭 Kıta",currency:"💰 Para birimi",leader:"👑 Yönetici"};
const R={Europe:"Avrupa",Asia:"Asya",Africa:"Afrika",Americas:"Amerika",Oceania:"Okyanusya",Antarctic:"Antarktika"};
const LK={brunei:"BRN",cambodia:"KHM",indonesia:"IDN",laos:"LAO",malaysia:"MYS",myanmar:"MMR",philippines:"PHL",singapore:"SGP",thailand:"THA",vietnam:"VNM",argentina:"ARG",australia:"AUS",brazil:"BRA",canada:"CAN",china:"CHN",france:"FRA",germany:"DEU",india:"IND",italy:"ITA",japan:"JPN",mexico:"MEX",russia:"RUS",saudi_arabia:"SAU",south_africa:"ZAF",south_korea:"KOR",turkey:"TUR",uk:"GBR",usa:"USA"};
const SYMBOLS=["▲","◆","●","■"];
let S={role:"none",phase:"home",pin:"",peer:null,conn:null,players:new Map(),playerId:"",playerName:"",mode:"mix",region:"all",scope:"countries",n:15,duration:20,questions:[],index:-1,deadline:0,tick:null,selected:-1,me:null,current:null,answers:0,loading:false,status:"",data:[],topo:null,shapeMap:new Map(),leaders:{},leaderDate:"",timerValue:20};
function e(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function rand(n){const a=new Uint32Array(1);if(globalThis.crypto?.getRandomValues){crypto.getRandomValues(a);return a[0]%n}return Math.floor(Math.random()*n)}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){let j=rand(i+1);[a[i],a[j]]=[a[j],a[i]]}return a}
function cn(c){return c.translations?.tur?.common||c.name?.common||c.cca3}
function caps(c){return Array.isArray(c.capital)?c.capital.filter(Boolean):[]}
function langs(c){return [...new Set(Object.values(c.languages||{}).filter(Boolean))]}
function currencies(c){return Object.keys(c.currencies||{})}
function cont(c){return (c.continents?.length?c.continents:[c.region]).filter(Boolean)}
function flag(c){return c.flag||"🌐"}
function note(s,type="error"){return '<div class="'+type+'">'+e(s)+'</div>'}
function show(html){APP.innerHTML=html;window.scrollTo({top:0,behavior:"smooth"})}
function card(content){return '<section class="panel">'+content+'</section>'}
function back(label="Geri dön"){return '<button class="back" data-action="home">← '+e(label)+'</button>'}
function btn(action,label,kind="primary",extra=""){return '<button class="btn '+kind+'" data-action="'+e(action)+'" '+extra+'>'+label+'</button>'}
function reset(){clearInterval(S.tick);try{if(S.role==="host")broadcast({t:"closed"})}catch(_){}try{S.conn?.close()}catch(_){}try{S.peer?.destroy()}catch(_){}S.role="none";S.phase="home";S.peer=null;S.conn=null;S.players=new Map();S.questions=[];S.index=-1;S.current=null;S.pin="";S.selected=-1;S.me=null;S.loading=false;S.status=""}
function home(){reset();show('<div class="panel intro"><div class="eyebrow">KAHOOT TARZI • COĞRAFYA</div><h1 class="title">Bir PIN.<br><em>Herkes yarışta!</em></h1><p class="sub">Sunucu soruları yönetir, oyuncular telefonlarından cevap verir. Bayraklar, başkentler, ülkeler ve canlı puan tablosu!</p></div><div class="tiles"><button class="tile" data-action="configure"><span class="emoji">🎤</span><strong>Yarışma oluştur ↗</strong><small>Sunucu ol, PIN üret, herkesi oyuna davet et.</small></button><button class="tile" data-action="join"><span class="emoji">📱</span><strong>PIN ile katıl ↗</strong><small>PIN ve takma ad gir, arkadaşlarınla yarış.</small></button></div><div class="notice">ℹ️ İlk sürümde aynı anda küçük arkadaş ve aile grupları için tasarlandı (önerilen 2–15 oyuncu). Bağlantı internet, tarayıcı ve ücretsiz üçüncü taraf hizmetin durumuna bağlıdır.</div>')}
function configure(){S.role="host";S.phase="configure";const opts=(dict,current)=>Object.entries(dict).map(([k,v])=>'<option value="'+k+'"'+(current===k?" selected":"")+'>'+v+'</option>').join("");
show(back()+card('<div class="eyebrow">SUNUCU EKRANI</div><h1 class="title">Yarışmanı <em>kur.</em></h1><p class="sub">Oyun PIN ile açılacak. Oyuncuların hesap oluşturmasına gerek yok.</p><div class="settings"><div><label class="field" for="q-mode">🎲 Oyun modu</label><select class="select" id="q-mode">'+opts(MODES,S.mode)+'</select></div><div><label class="field" for="q-region">🌍 Kıta</label><select class="select" id="q-region">'+opts(REGIONS,S.region)+'</select></div><div><label class="field" for="q-scope">🗺️ Kapsam</label><select class="select" id="q-scope"><option value="countries">Bağımsız ülkeler</option><option value="all">Ülkeler + bağlı bölgeler</option></select></div><div><label class="field" for="q-n">🎯 Soru sayısı</label><select class="select" id="q-n"><option value="10">10 soru</option><option value="15">15 soru</option><option value="20">20 soru</option><option value="30">30 soru</option></select></div><div><label class="field" for="q-duration">⏱️ Soru başı süre</label><select class="select" id="q-duration"><option value="10">10 saniye</option><option value="20">20 saniye</option><option value="30">30 saniye</option></select></div></div><div class="actions">'+btn("create","🎤 PIN oluştur →")+'</div><p class="hint">Harita ve yönetici oyunlarında kaynak verisi bulunmayan ülkeler atlanır. Dünya liderleri kaynağı yalnızca seçili ülkeleri kapsar.</p>'));
$("q-scope").value=S.scope;$("q-n").value=String(S.n);$("q-duration").value=String(S.duration)}
function joinScreen(message=""){S.role="guest";S.phase="join";let hinted=new URLSearchParams(location.search).get("join")||S.pin||"";hinted=/^\d{6}$/.test(hinted)?hinted:"";
show(back()+card('<div class="eyebrow">OYUNCU GİRİŞİ</div><h1 class="title">Oyuna <em>katıl.</em></h1><p class="sub">Sunucunun ekranındaki altı haneli PIN kodunu ve takma adını gir.</p>'+(message?note(message):"")+'<label class="field" for="join-pin">6 haneli oyun PIN’i</label><input class="input joinpin" id="join-pin" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" placeholder="000000" value="'+e(hinted)+'" autocomplete="one-time-code" aria-label="6 haneli PIN"><label class="field" for="join-name">Takma adın</label><input class="input" id="join-name" maxlength="18" placeholder="Örnek: Gezgin" autocomplete="nickname" value="'+e(S.playerName)+'"><div class="actions">'+btn("connect","🚀 Oyuna katıl →")+'</div><p class="hint">Gerçek adını yazmak zorunda değilsin. Özel bilgi veya şifre paylaşma.</p>'))}
function spin(msg){show(card('<div class="center"><div class="big-emoji">🌐</div><div class="eyebrow">BAĞLANTI KURULUYOR</div><h2>'+e(msg)+'</h2><p class="sub">İnternet bağlantını kontrol et. '+e(S.status)+'</p><div class="actions" style="justify-content:center">'+btn("home","İptal","warning")+'</div></div>'))}
async function fetchData(urls){let last;for(const url of urls){try{const r=await fetch(url);if(!r.ok)throw Error("HTTP "+r.status);return await r.json()}catch(err){last=err}}throw last||Error("Veri alınamadı")}
async function loadSources(){if(S.data.length)return;S.data=await fetchData(["https://cdn.jsdelivr.net/gh/mledoze/countries@master/countries.json","https://raw.githubusercontent.com/mledoze/countries/master/countries.json"]);if(!Array.isArray(S.data))throw Error("Ülke verisi geçersiz");S.data=S.data.filter(c=>c.cca3&&c.name?.common);
const sources=await Promise.allSettled([fetchData(["https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json","https://unpkg.com/world-atlas@2/countries-50m.json"]),fetchData(["https://raw.githubusercontent.com/open-data-archive/world-leaders-current/main/data/current/all-leaders.json"])]);
if(sources[0].status==="fulfilled"){S.topo=sources[0].value;S.shapeMap=new Map(S.topo.objects.countries.geometries.map(g=>[String(Number(g.id)),g]))}
if(sources[1].status==="fulfilled"){S.leaderDate=sources[1].value.snapshot_date||"";for(const [key,val] of Object.entries(sources[1].value.leaders||{}))if(LK[key])S.leaders[LK[key]]=val}
}
function peerFail(err){let type=err?.type||"",msg=err?.message||String(err);if(S.role==="host"&&type==="unavailable-id"){S.peer?.destroy();S.peer=null;S.pin="";createPin();return}
if(S.role==="guest"&&["peer-unavailable","unavailable-id"].includes(type)){try{S.peer?.destroy()}catch(_){}S.peer=null;joinScreen("Bu PIN'e sahip açık bir yarışma bulunamadı. PIN'i kontrol et.");return}
clearInterval(S.tick);S.status=msg;show(card('<h1 class="title">⚠️ Bağlantı kurulamadı</h1>'+note(msg)+'<p class="sub">İnterneti, PIN’i veya tarayıcı bağlantı izinlerini kontrol et. Bazı ağlarda doğrudan bağlantı engellenebilir.</p><div class="actions">'+btn("home","Ana sayfaya dön")+'</div>'))}
async function beginHost(){if(typeof Peer!=="function"){peerFail(Error("Canlı bağlantı kütüphanesi yüklenmedi."));return}
S.mode=$("q-mode").value;S.region=$("q-region").value;S.scope=$("q-scope").value;S.n=Number($("q-n").value);S.duration=Number($("q-duration").value);S.status="Ülke soruları hazırlanıyor.";spin("Oyun verileri yükleniyor…");
try{await loadSources()}catch(err){peerFail(Error("Ülke bilgileri yüklenemedi: "+err.message));return}
let q=generate();if(q.length<1){peerFail(Error("Seçilen mod ve kıta için yeterli soru bulunamadı. Lütfen başka seçim yap."));return}S.questions=q;S.status="Oyun odası oluşturuluyor.";spin("PIN hazırlanıyor…");createPin()}
function createPin(){if(S.role!=="host")return;S.pin=String(100000+rand(900000));let p;try{p=new Peer("geoquest6-"+S.pin,{debug:0})}catch(err){peerFail(err);return}S.peer=p;
p.on("open",()=>{if(S.peer!==p)return;S.phase="lobby";p.on("connection",hostConnection);showHostLobby()});
p.on("error",err=>{if(S.peer===p)peerFail(err)});
p.on("disconnected",()=>{S.status="Sinyal sunucusuna bağlantı kesildi; yeni oyuncular katılamayabilir."});
}
function playerList(){return [...S.players.values()].sort((a,b)=>b.score-a.score||a.name.localeCompare(b.name,"tr"))}
function lobbyPeople(){let players=playerList();return players.length?'<div class="playergrid">'+players.map(p=>'<div class="player"><b>🧑</b><span>'+e(p.name)+(p.connected?"":" <small class='muted'>(ayrıldı)</small>")+'</span></div>').join("")+'</div>':'<div class="empty">👀 Oyuncular PIN ile katılınca burada görünecek.</div>'}
function roomLink(){let u=new URL(location.href);u.searchParams.set("join",S.pin);return u.toString()}
function showHostLobby(){S.phase="lobby";show(card('<div class="center"><div class="eyebrow">OYUNCULAR KATILIYOR</div><h1 class="title">Oyun PIN’i</h1><div class="pin">'+e(S.pin)+'</div><p class="sub">Arkadaşların <strong>GeoQuest Live</strong> sayfasından bu PIN ile katılsın.</p><div class="actions" style="justify-content:center">'+btn("copy","🔗 Katılım bağlantısını kopyala","secondary")+'</div></div><div class="footerline"><strong id="playercount">'+S.players.size+' oyuncu</strong><span class="badge">● ODA AÇIK</span></div><div id="people">'+lobbyPeople()+'</div><div class="actions">'+btn("start","🚀 Yarışmayı başlat →","primary",'id="startgame" '+(S.players.size?"":"disabled"))+btn("home","Odayı kapat","warning")+'</div><p class="hint">Sunucu bu sekmeyi açık tutmalı. Yarışma en az bir oyuncu katılınca başlayabilir.</p>'))}
function updateLobby(){if(S.role!=="host"||S.phase!=="lobby")return;if($("people"))$("people").innerHTML=lobbyPeople();if($("playercount"))$("playercount").textContent=S.players.size+" oyuncu";if($("startgame"))$("startgame").disabled=!playerList().some(p=>p.connected)}
function broadcast(msg){for(const p of S.players.values()){if(p.connected&&p.conn?.open){try{p.conn.send(msg)}catch(_){}}}}
function roster(){return playerList().map(p=>({id:p.id,name:p.name,score:p.score,correct:p.correct,connected:p.connected}))}
function hostConnection(conn){if(S.role!=="host"){conn.close();return}let pid=null;
conn.on("open",()=>{try{conn.send({t:"hello"})}catch(_){}});
conn.on("data",m=>{
if(!m||typeof m!=="object")return;
if(m.t==="join"){
if(pid)return;
const id=String(m.id||"").slice(0,48);let name=String(m.name||"").trim().slice(0,18).replace(/[<>]/g,"");
if(!id||!name){conn.send({t:"deny",message:"Takma ad gerekli."});setTimeout(()=>conn.close(),200);return}
if(S.players.size>=30&&!S.players.has(id)){conn.send({t:"deny",message:"Oda dolu (30 oyuncu)."});setTimeout(()=>conn.close(),200);return}
let existing=S.players.get(id);if(existing){try{existing.conn?.close()}catch(_){}}else{let base=name,i=2;while([...S.players.values()].some(p=>p.name.toLocaleLowerCase("tr")===name.toLocaleLowerCase("tr")))name=(base.slice(0,14)+" "+i++).slice(0,18);existing={id,name,score:0,correct:0,answered:-1,connected:false}}
pid=id;Object.assign(existing,{conn,connected:true});S.players.set(id,existing);
conn.send({t:"welcome",id,name:existing.name,pin:S.pin,phase:S.phase,score:existing.score,questions:S.questions.length});
if(S.phase==="question"&&S.current)conn.send(questionPacket());
else if(S.phase==="reveal"){conn.send(questionPacket());conn.send(revealPacket())}
else if(S.phase==="finish")conn.send({t:"finish",board:roster()});
broadcast({t:"roster",players:roster()});updateLobby();updateHostProgress();return}
if(m.t==="answer"&&pid&&S.phase==="question"){let p=S.players.get(pid);if(!p||!p.connected||p.answered===S.index)return;
let opt=Number(m.option);if(Number(m.q)!==S.index||!Number.isInteger(opt)||opt<0||opt>3)return;
if(Date.now()>S.deadline+300)return;
p.answered=S.index;S.answers++;let elapsed=Math.max(0,S.duration*1000-(S.deadline-Date.now()));let ok=opt===S.current.correct;
let pts=ok?Math.round(500+500*Math.max(0,1-elapsed/(S.duration*1000))):0;p.score+=pts;if(ok)p.correct++;
conn.send({t:"receipt",q:S.index,option:opt,received:true});updateHostProgress();if(allAnswered())setTimeout(()=>{if(S.phase==="question"&&allAnswered())revealQuestion()},350);
return}
});
conn.on("close",()=>{if(!pid)return;let p=S.players.get(pid);if(p&&p.conn===conn){p.connected=false;broadcast({t:"roster",players:roster()});updateLobby();updateHostProgress();if(S.phase==="question"&&allAnswered())revealQuestion()}});
conn.on("error",()=>{})
}
function allAnswered(){let ps=playerList().filter(p=>p.connected);return ps.length>0&&ps.every(p=>p.answered===S.index)}
function startHost(){if(S.role!=="host"||S.phase!=="lobby"||!playerList().some(p=>p.connected))return;S.index=-1;nextQuestion()}
function questionPacket(){let q=S.current;return {t:"question",q:S.index,total:S.questions.length,mode:q.mode,title:q.title,visual:q.visual,options:q.options,duration:Math.max(1,Math.ceil((S.deadline-Date.now())/1000))}}
function nextQuestion(){clearInterval(S.tick);if(S.index+1>=S.questions.length){finishHost();return}S.index++;S.answers=0;S.current=S.questions[S.index];S.deadline=Date.now()+S.duration*1000;S.phase="question";broadcast(questionPacket());showHostQuestion();S.tick=setInterval(()=>{if(S.phase!=="question")return;const sec=Math.max(0,Math.ceil((S.deadline-Date.now())/1000));S.timerValue=sec;if($("timer"))$("timer").textContent=String(sec);if($("timebar"))$("timebar").style.width=(sec/S.duration*100)+"%";if(sec===0)revealQuestion()},120)}
function optionsHTML(q,selected=-1,correct=-1,disabled=false){return '<div class="answers">'+q.options.map((v,i)=>'<button class="answer '+(selected===i?"selected ":"")+(correct===i?"correct ":"")+(correct>=0&&correct!==i?"dim ":"")+'" data-option="'+i+'" '+(disabled?"disabled":"")+'><span class="symbol">'+SYMBOLS[i]+'</span>'+e(v)+'</button>').join("")+'</div>'}
function visualHTML(v){if(!v)return "";if(v.type==="flag"){let src="https://flagcdn.com/w320/"+encodeURIComponent(v.iso.toLowerCase())+".png";return '<img src="'+src+'" alt="Ülke bayrağı" onerror="this.replaceWith(document.createTextNode(this.dataset.fallback))" data-fallback="'+e(v.fallback||"🏳️")+'">'}
if(v.type==="shape"){return '<svg viewBox="0 0 460 260" role="img" aria-label="Ülkenin silueti"><path d="'+e(v.path)+'" fill="#85f1d1" stroke="#e4fff7" stroke-width="2" fill-rule="evenodd" stroke-linejoin="round"/></svg>'}
return '<span class="big">'+e(v.value||"🌐")+'</span>'}
function showHostQuestion(){let q=S.current;
show(card('<div class="qhead"><div>📣 SUNUCU • SORU '+(S.index+1)+' / '+S.questions.length+'</div><div class="timer" id="timer">'+S.duration+'</div></div><div class="bar"><div class="fill" id="timebar"></div></div><div class="questionbox"><div class="qVisual">'+visualHTML(q.visual)+'</div><div class="label">'+e(MODES[q.mode])+'</div><h2>'+e(q.title)+'</h2></div>'+optionsHTML(q,-1,-1,true)+'<div class="footerline"><strong id="responsecount">0 / '+playerList().filter(x=>x.connected).length+' cevap</strong><span>PIN: <b>'+e(S.pin)+'</b></span></div><div class="actions">'+btn("reveal","⏩ Cevapları göster","secondary")+'</div>'))}
function updateHostProgress(){if($("responsecount")&&S.role==="host"&&S.phase==="question")$("responsecount").textContent=S.answers+" / "+playerList().filter(x=>x.connected).length+" cevap"}
function revealPacket(){return {t:"reveal",q:S.index,correct:S.current.correct,answer:S.current.options[S.current.correct],info:S.current.info,board:roster()}}
function revealQuestion(){if(S.role!=="host"||S.phase!=="question")return;clearInterval(S.tick);S.phase="reveal";broadcast(revealPacket());showRevealHost()}
function ranksHTML(board){return '<div class="leaderboard">'+board.slice().sort((a,b)=>b.score-a.score).map((p,i)=>'<div class="rank"><span class="position">'+(i===0?"🥇":i===1?"🥈":i===2?"🥉":(i+1)+".")+'</span><strong>'+e(p.name)+(p.connected===false?" <span class='small muted'>(ayrıldı)</span>":"")+'</strong><span class="points">'+p.score.toLocaleString("tr-TR")+' XP</span></div>').join("")+'</div>'}
function showRevealHost(){const q=S.current;
show(card('<div class="center"><div class="eyebrow">SORU '+(S.index+1)+' TAMAMLANDI</div><h1 class="title">Doğru cevap <em>burada!</em></h1><div class="questionbox"><div class="qVisual">'+visualHTML(q.visual)+'</div><h2>'+e(q.title)+'</h2></div></div>'+optionsHTML(q,-1,q.correct,true)+'<p class="hint center">'+e(q.info)+'</p><div class="center" style="margin-top:22px"><div class="eyebrow">CANLI SIRALAMA</div></div>'+ranksHTML(roster())+'<div class="actions" style="justify-content:center">'+btn("next",S.index+1>=S.questions.length?"🏆 Podyuma geç →":"Sonraki soruya geç →")+'</div>'))}
function finishHost(){S.phase="finish";clearInterval(S.tick);broadcast({t:"finish",board:roster()});showFinished(true,roster())}
function showFinished(host,board){S.phase="finish";let winner=board[0];show(card('<div class="center"><div class="eyebrow">GEOQUEST LIVE • FİNAL</div><div class="medals">🏆</div><h1 class="title">Yarışma <em>bitti!</em></h1><p class="sub">'+(winner?"Şampiyon: <strong>"+e(winner.name)+"</strong> 🎉":"Herkese teşekkürler!")+'</p></div>'+ranksHTML(board)+'<div class="actions" style="justify-content:center">'+(host?btn("replay","🔁 Aynı oyuncularla tekrar"):btn("home","Ana sayfa"))+btn("home","Yeni oyun / çıkış","secondary")+'</div>'))}
function replay(){if(S.role!=="host")return;S.questions=generate();if(!S.questions.length){peerFail(Error("Yeni soru seti hazırlanamadı."));return}for(const p of S.players.values()){p.score=0;p.correct=0;p.answered=-1}S.index=-1;S.phase="lobby";broadcast({t:"lobby",pin:S.pin,players:roster(),questions:S.questions.length});showHostLobby()}
function guestConnect(){if(typeof Peer!=="function"){joinScreen("Bağlantı kütüphanesi yüklenmedi. İnternet bağlantını kontrol et.");return}
let pin=$("join-pin").value.trim(),name=$("join-name").value.trim().slice(0,18);
if(!/^\d{6}$/.test(pin)){joinScreen("Altı haneli bir PIN gir.");return}
if(name.length<2){S.pin=pin;joinScreen("En az iki karakterli bir takma ad yaz.");return}
S.pin=pin;S.playerName=name;S.role="guest";S.phase="connecting";S.playerId=(()=>{try{return sessionStorage.getItem("geoquest-id")||(()=>{let id="p"+rand(1e9)+"-"+rand(1e9);sessionStorage.setItem("geoquest-id",id);return id})()}catch(_){return "p"+rand(1e9)+"-"+rand(1e9)}})();
spin("Oyun odasına bağlanılıyor…");
let p;try{p=new Peer({debug:0})}catch(err){peerFail(err);return}S.peer=p;
p.on("open",()=>{if(S.peer!==p)return;let conn=p.connect("geoquest6-"+pin,{reliable:true,serialization:"json"});S.conn=conn;conn.on("open",()=>{conn.send({t:"join",id:S.playerId,name:S.playerName})});conn.on("data",guestMessage);conn.on("error",err=>{if(S.role==="guest")peerFail(err)});conn.on("close",()=>{if(S.role==="guest"&&!["home","join"].includes(S.phase))peerFail(Error("Sunucu ile bağlantı kapandı. Sunucu oyunu sonlandırmış olabilir."))})});
p.on("error",err=>{if(S.peer===p)peerFail(err)});setTimeout(()=>{if(S.peer===p&&S.phase==="connecting")peerFail(Error("Bağlantı zaman aşımına uğradı. PIN’i kontrol et veya yeniden dene."))},15000)}
function guestMessage(m){if(!m||typeof m!=="object")return;
if(m.t==="deny"){const reason=m.message||"Katılım reddedildi.";joinScreen(reason);try{S.conn?.close()}catch(_){}try{S.peer?.destroy()}catch(_){}S.conn=null;S.peer=null;return}
if(m.t==="welcome"){S.me={id:m.id,name:m.name,score:m.score};S.phase=m.phase==="finish"?"finish":"waiting";guestWaiting();return}
if(m.t==="roster"){if(S.phase==="waiting"&&$("playercount"))$("playercount").textContent=(m.players||[]).filter(p=>p.connected).length+" oyuncu katıldı";return}
if(m.t==="lobby"){S.phase="waiting";guestWaiting();return}
if(m.t==="question"){S.current=m;S.selected=-1;S.phase="question";S.timerValue=m.duration;guestQuestion();startGuestClock(m.duration);return}
if(m.t==="receipt"){if(S.phase==="answered"){$("confirm")?.replaceChildren(document.createTextNode("✅ Cevabın sunucuya ulaştı. Sonucu bekle…"))}return}
if(m.t==="reveal"){if(S.current&&m.q!==S.current.q)return;clearInterval(S.tick);S.phase="reveal";if(S.me){let p=(m.board||[]).find(p=>p.id===S.me.id);if(p)S.me.score=p.score}guestReveal(m);return}
if(m.t==="finish"){clearInterval(S.tick);showFinished(false,m.board||[]);return}
if(m.t==="closed"){clearInterval(S.tick);peerFail(Error("Sunucu odayı kapattı."));return}
}
function guestWaiting(){show(card('<div class="center"><div class="eyebrow">GEOQUEST LIVE • OYUNCU</div><div class="big-emoji">🎉</div><h1 class="title">Hoş geldin, <em>'+e(S.me?.name||S.playerName)+'!</em></h1><span class="badge">✓ BAĞLANTI KURULDU</span><p class="sub">Sunucu yarışmayı başlatınca sorular otomatik olarak telefonunda görünecek.</p><div class="two"><div class="infobox"><strong>'+e(S.pin)+'</strong><small>Oyun PIN’i</small></div><div class="infobox"><strong id="playercount">✓</strong><small>Oyuncular</small></div></div><p class="hint">Bu sayfayı açık tut. Sunucuyu başka bir cihazda aç.</p><div class="actions" style="justify-content:center">'+btn("home","Oyundan ayrıl","secondary")+'</div></div>'))}
function startGuestClock(duration){clearInterval(S.tick);const end=Date.now()+duration*1000;S.tick=setInterval(()=>{if(!["question","answered"].includes(S.phase)){clearInterval(S.tick);return}let t=Math.max(0,Math.ceil((end-Date.now())/1000));if($("timer"))$("timer").textContent=t;if($("timebar"))$("timebar").style.width=(t/duration*100)+"%";if(t===0&&S.phase==="question"){S.phase="answered";let container=$("choices");if(container)container.querySelectorAll("button").forEach(b=>b.disabled=true);if($("confirm"))$("confirm").textContent="⏳ Süre doldu. Sonuçlar hazırlanıyor…"}},120)}
function guestQuestion(){const q=S.current;show(card('<div class="qhead"><span>📱 SORU '+(q.q+1)+' / '+q.total+'</span><span class="timer" id="timer">'+q.duration+'</span></div><div class="bar"><div class="fill" id="timebar"></div></div><div class="questionbox"><div class="qVisual">'+visualHTML(q.visual)+'</div><div class="label">'+e(MODES[q.mode]||"Coğrafya")+'</div><h2>'+e(q.title)+'</h2></div><div id="choices">'+optionsHTML(q)+'</div><div id="confirm" class="statline center">Cevabını seç! ⚡ Hızlı ve doğru cevap daha fazla puan kazandırır.</div><div class="footerline"><span>Oyuncu: '+e(S.me?.name||S.playerName)+'</span><strong>'+Number(S.me?.score||0).toLocaleString("tr-TR")+' XP</strong></div>'))}
function guestAnswer(i){if(S.phase!=="question"||!Number.isInteger(i)||i<0||i>3)return;S.selected=i;S.phase="answered";if(S.conn?.open){try{S.conn.send({t:"answer",option:i,q:S.current.q})}catch(_){}}
document.querySelectorAll("#choices button").forEach(b=>{b.disabled=true;if(Number(b.dataset.option)===i)b.classList.add("selected")});
if($("confirm"))$("confirm").textContent="📨 Cevabın gönderildi. Sunucu açıklayana kadar bekle…"}
function guestReveal(m){const q=S.current;show(card('<div class="center"><div class="eyebrow">CEVAP AÇIKLANDI</div><div class="big-emoji">'+(S.selected===m.correct?"🎉":"📚")+'</div><h1 class="title">'+(S.selected===m.correct?"<em>Doğru bildin!</em>":"Yeni bir şey <em>öğrendin!</em>")+'</h1><div class="questionbox"><div class="qVisual">'+visualHTML(q.visual)+'</div><h2>'+e(q.title)+'</h2></div></div>'+optionsHTML(q,S.selected,m.correct,true)+'<p class="hint center">'+e(m.info)+'</p><div class="center"><div class="eyebrow">PUAN TABLOSU</div><div class="scoreStat">'+Number(S.me?.score||0).toLocaleString("tr-TR")+'</div><p class="sub">Senin toplam puanın • Sıradaki soruyu sunucu başlatacak.</p></div>'+ranksHTML(m.board||[])+'<div class="center">'+btn("home","Yarışmadan ayrıl","secondary")+'</div>'))}
function eligible(){return S.data.filter(c=>(S.scope==="all"||c.independent===true||c.unMember===true||["VAT","PSE","XKX"].includes(c.cca3))&&(S.region==="all"||cont(c).includes(S.region)))}
function modesFor(c){let z=["continent"];if(c.cca2)z.push("flag");if(caps(c).length)z.push("capital");if(langs(c).length)z.push("language");if(currencies(c).length)z.push("currency");if(S.shapeMap.has(String(Number(c.ccn3))))z.push("shape");if(S.leaders[c.cca3]&&(S.leaders[c.cca3].head_of_government||S.leaders[c.cca3].head_of_state))z.push("leader");return z}
function alternative(answer,list){let choices=[answer];for(const x of shuffle([...new Set(list)])){if(choices.length>=4)break;if(x!=null&&x!==answer&&String(x).trim()!=="")choices.push(x)}if(choices.length!==4)return null;return shuffle(choices)}
function question(c,mode,source){let title="",visual={type:"emoji",value:flag(c)},correct="",others=[],info="";
const capitals=caps(c),languages=langs(c),units=currencies(c);
if(mode==="flag"){title="Bu bayrak hangi ülkeye ait?";visual={type:"flag",iso:c.cca2,fallback:flag(c)};correct=cn(c);others=source.filter(x=>x!==c).map(cn)}
else if(mode==="capital"){title=cn(c)+" ülkesinin başkenti hangisidir?";correct=capitals[0];others=source.filter(x=>x!==c).flatMap(caps).filter(x=>!capitals.includes(x))}
else if(mode==="language"){title=cn(c)+" ülkesinin resmî dillerinden biri hangisidir?";correct=languages[rand(languages.length)];others=source.filter(x=>x!==c).flatMap(langs).filter(x=>!languages.includes(x))}
else if(mode==="continent"){title=cn(c)+" hangi kıtada yer alır?";correct=R[cont(c)[0]]||cont(c)[0];others=["Avrupa","Asya","Afrika","Amerika","Okyanusya","Antarktika"]}
else if(mode==="currency"){title=cn(c)+" hangi para birimini kullanır?";correct=units[0];others=source.filter(x=>x!==c).flatMap(currencies).filter(x=>!units.includes(x))}
else if(mode==="shape"){title="Bu siluet hangi ülkeye ait?";visual={type:"shape",path:silhouettePath(c.ccn3)};correct=cn(c);others=source.filter(x=>x!==c).map(cn)}
else if(mode==="leader"){const l=S.leaders[c.cca3];if(!l)return null;const role=l.head_of_government?"head_of_government":"head_of_state";title=cn(c)+" ülkesinin "+(role==="head_of_government"?"hükûmet başkanı":"devlet başkanı")+" kimdir?";correct=l[role];others=Object.values(S.leaders).map(v=>v[role]).filter(Boolean)}
let options=alternative(correct,others);if(!options)return null;
info=cn(c)+" • Başkent: "+(capitals.join(", ")||"—")+" • Diller: "+(languages.join(", ")||"—")+" • Kıta: "+cont(c).map(x=>R[x]||x).join(", ");
if(mode==="leader")info+=" • Yönetici kayıt tarihi: "+(S.leaderDate||"belirtilmemiş")+"; güncelliği resmî kaynaklardan kontrol et.";
return {mode,title,visual,options,correct:options.indexOf(correct),info}
}
function generate(){let source=eligible(),types=S.mode==="mix"?["flag","capital","shape","language","continent","currency",...(Object.keys(S.leaders).length>3?["leader"]:[])]:[S.mode];let arr=[];
for(let c of shuffle(source)){if(arr.length>=S.n)break;let eligibleTypes=shuffle(types.filter(m=>modesFor(c).includes(m)));for(const m of eligibleTypes){let q=question(c,m,source);if(q){arr.push(q);break}}}
if(arr.length<S.n&&S.mode!=="mix"){for(let c of shuffle(source)){if(arr.length>=S.n)break;if(!modesFor(c).includes(S.mode))continue;let q=question(c,S.mode,source);if(q)arr.push(q)}}
return shuffle(arr).slice(0,S.n)
}
function decodeArc(t,i){let rev=i<0,arc=t.arcs[rev?~i:i],x=0,y=0;let pts=arc.map(d=>{x+=d[0];y+=d[1];return [x*t.transform.scale[0]+t.transform.translate[0],y*t.transform.scale[1]+t.transform.translate[1]]});return rev?pts.reverse():pts}
function ring(t,arcs){let pts=[];for(let i=0;i<arcs.length;i++){let a=decodeArc(t,arcs[i]);if(i)a=a.slice(1);pts.push(...a)}return pts}
function silhouettePath(id){const t=S.topo,g=S.shapeMap.get(String(Number(id)));if(!t||!g)return "";let polys=g.type==="Polygon"?[g.arcs]:g.type==="MultiPolygon"?g.arcs:[];let rings=polys.flatMap(poly=>poly.map(a=>ring(t,a))).filter(x=>x.length>2),flat=rings.flat();if(!flat.length)return "";let [minx,maxx,miny,maxy]=[Infinity,-Infinity,Infinity,-Infinity];for(const [x,y] of flat){minx=Math.min(minx,x);maxx=Math.max(maxx,x);miny=Math.min(miny,y);maxy=Math.max(maxy,y)}
let w=maxx-minx||1,h=maxy-miny||1,scale=Math.min(425/w,235/h),ox=230-w*scale/2,oy=130-h*scale/2;return rings.map(points=>"M"+points.map(p=>[(ox+(p[0]-minx)*scale).toFixed(1),(oy+(maxy-p[1])*scale).toFixed(1)].join(",")).join("L")+"Z").join(" ")}
async function copyLink(){let text=new URL(roomLink()).toString();try{await navigator.clipboard.writeText(text);let b=document.querySelector('[data-action="copy"]');if(b)b.textContent="✅ Bağlantı kopyalandı"}catch(_){window.prompt("Bu adresi kopyala:",text)}}
APP.addEventListener("click",evt=>{let b=evt.target.closest("button");if(!b)return;let action=b.dataset.action;if(action==="home")home();else if(action==="configure")configure();else if(action==="join")joinScreen();else if(action==="create")beginHost();else if(action==="connect")guestConnect();else if(action==="copy")copyLink();else if(action==="start")startHost();else if(action==="reveal")revealQuestion();else if(action==="next")nextQuestion();else if(action==="replay")replay();if(b.dataset.option!==undefined&&S.role==="guest")guestAnswer(Number(b.dataset.option))});
document.addEventListener("keydown",ev=>{if(ev.key==="Enter"&&S.phase==="join"){$('join-name')?.blur();guestConnect()}});
if(new URLSearchParams(location.search).get("join"))joinScreen();else home();
</script>
</body></html>
